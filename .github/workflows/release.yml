name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（例如 v0.1.0）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the vX.Y.Z format: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "APP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Build app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-app.sh

      - name: Create archive and checksum
        shell: bash
        run: |
          ARCHIVE="Pi-Mac-${RELEASE_TAG}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Pi Mac.app" "dist/$ARCHIVE"
          cd dist
          shasum -a 256 "$ARCHIVE" > SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        run: |
          ARCHIVE="dist/Pi-Mac-${RELEASE_TAG}.zip"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE" dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE" dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Pi Mac $RELEASE_TAG" \
              --generate-notes
          fi
